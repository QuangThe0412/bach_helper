[package]
name = "batch_helper"
version = "0.1.0"
description = "Batch Helper - Java Ant Build Manager (Win95)"
authors = ["vinx"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "batch_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5" }
tauri-plugin-log = "2"
rfd = "0.15"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
